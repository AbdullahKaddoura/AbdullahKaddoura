name: Canvas

# Anyone can open an issue here, so everything from the issue is treated as
# hostile input: it is passed to Python through the environment and never
# interpolated into a shell command.

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

# Serialise placements so two people painting at once can't clobber state.json.
concurrency:
  group: canvas
  cancel-in-progress: false

jobs:
  place:
    # Cheap filter so unrelated issues don't spin up a runner.
    if: startsWith(github.event.issue.title, 'place')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply the placement
        id: place
        working-directory: canvas
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_ACTOR: ${{ github.event.issue.user.login }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python place.py

      - name: Commit the new canvas
        if: steps.place.outputs.status == 'ok'
        env:
          ACTOR: ${{ github.event.issue.user.login }}
          COORDS: ${{ github.event.issue.number }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canvas/state.json assets/ README.md
          if git diff --staged --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "canvas: pixel from @${ACTOR} (#${COORDS})"
          git push

      - name: Reply and close
        if: always() && steps.place.outputs.message != ''
        uses: actions/github-script@v7
        env:
          RESULT: ${{ steps.place.outputs.message }}
          STATUS: ${{ steps.place.outputs.status }}
        with:
          script: |
            const body = process.env.RESULT;
            const ok = process.env.STATUS === 'ok';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: ok
                ? `${body}\n\nThe canvas above has been redrawn.`
                : `${body}`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: ok ? 'completed' : 'not_planned',
            });
